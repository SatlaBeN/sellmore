<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Control Panel</title>
<style>
  :root {
    --bg: #0f1016;
    --panel: #191b24;
    --line: #2a2d3a;
    --text: #eceef5;
    --muted: #9aa0b4;
    --accent: #ffd400;
    --ok: #2ecc71;
    --warn: #ffb020;
    --bad: #ff4d6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Heebo", Arial, sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
    gap: 16px;
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { max-width: 1100px; margin: 0 auto 16px; font-size: 22px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .detail { color: var(--muted); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font: inherit;
    min-width: 0;
  }
  button {
    background: var(--accent);
    color: #111;
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  code {
    direction: ltr;
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    overflow-wrap: anywhere;
  }
  .stats { display: flex; gap: 24px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--text); font-size: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.result { color: var(--accent); font-weight: 700; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-inline-start: 6px; }
  .empty { color: var(--muted); font-size: 14px; }
  .preview {
    width: 100%;
    aspect-ratio: 1 / 1.1;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: repeating-conic-gradient(#20222c 0% 25%, #191b24 0% 50%) 50% / 24px 24px;
  }
</style>
</head>
<body>
<h1>גלגל המזל ללייב – לוח בקרה</h1>
<main>
  <div>
    <section>
      <h2>חיבור ללייב בטיקטוק</h2>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">מתחבר לשרת…</span></div>
      <div class="detail" id="statusDetail"></div>
      <div class="stats">
        <div>בתור: <b id="queue">0</b></div>
        <div>כל <b id="coinsPerSpin">–</b> מטבעות = סיבוב</div>
      </div>
    </section>

    <section>
      <h2>בדיקה בלי לייב</h2>
      <div class="row">
        <input id="testName" value="tester" aria-label="שם הצופה לבדיקה" size="12">
        <input id="testCoins" type="number" min="1" aria-label="מטבעות" size="7">
        <button id="testBtn">שליחת מתנת בדיקה</button>
        <button class="secondary" id="clearBtn">ניקוי התור</button>
      </div>
      <div class="detail">מדמה מתנה מצופה. סיבובי בדיקה לא נשמרים בקובץ התוצאות.</div>
    </section>

    <section>
      <h2>תוצאות אחרונות</h2>
      <table id="resultsTable" hidden>
        <thead><tr><th>שעה</th><th>צופה</th><th>מטבעות</th><th>תוצאה</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
      <div class="empty" id="noResults">עוד לא היו סיבובים.</div>
    </section>
  </div>

  <div>
    <section>
      <h2>הכתובת להוספה ל-TikTok LIVE Studio / OBS</h2>
      <div class="row">
        <code id="overlayUrl"></code>
        <button class="secondary" id="copyBtn">העתקה</button>
      </div>
    </section>
    <section>
      <h2>תצוגה מקדימה</h2>
      <iframe class="preview" id="preview" title="תצוגה מקדימה של הגלגל"></iframe>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const overlayUrl = `${location.origin}/overlay.html`;
  $('overlayUrl').textContent = overlayUrl;
  $('preview').src = 'overlay.html?always=1&sound=0';

  const STATUS = {
    connected: ['ok', 'מחובר ללייב'],
    connecting: ['warn', 'מתחבר…'],
    offline: ['bad', 'לא מחובר (הלייב כבוי?)'],
    'not-configured': ['bad', 'לא הוגדר שם משתמש בקובץ config.json'],
    idle: ['', 'ממתין']
  };

  let ws = null;

  function renderState(msg) {
    const [cls, text] = STATUS[msg.tiktok.state] || ['', msg.tiktok.state];
    $('dot').className = `dot ${cls}`;
    $('statusText').textContent = text;
    $('statusDetail').textContent = msg.tiktok.detail || '';
    $('queue').textContent = msg.queueLength + (msg.current ? 1 : 0);

    const body = $('results');
    body.replaceChildren();
    for (const r of msg.recentResults) {
      const tr = document.createElement('tr');
      const time = document.createElement('td');
      time.textContent = new Date(r.at).toLocaleTimeString('he-IL');
      const who = document.createElement('td');
      who.textContent = r.username ? `@${r.username}` : r.nickname;
      if (r.test) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'בדיקה';
        who.append(tag);
      }
      const coins = document.createElement('td');
      coins.textContent = r.coins;
      const result = document.createElement('td');
      result.className = 'result';
      result.textContent = r.result;
      tr.append(time, who, coins, result);
      body.append(tr);
    }
    $('resultsTable').hidden = msg.recentResults.length === 0;
    $('noResults').hidden = msg.recentResults.length > 0;
  }

  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'config') {
        $('coinsPerSpin').textContent = msg.config.coinsPerSpin;
        if (!$('testCoins').value) $('testCoins').value = msg.config.coinsPerSpin;
      } else if (msg.type === 'state') {
        renderState(msg);
      }
    };
    ws.onclose = () => {
      $('dot').className = 'dot bad';
      $('statusText').textContent = 'השרת לא רץ – הפעילו npm start';
      $('statusDetail').textContent = '';
      setTimeout(connect, 2000);
    };
  }

  const send = (msg) => ws?.readyState === WebSocket.OPEN && ws.send(JSON.stringify(msg));
  $('testBtn').onclick = () => send({ type: 'test', nickname: $('testName').value.trim() || 'tester', coins: Number($('testCoins').value) });
  $('clearBtn').onclick = () => send({ type: 'clearQueue' });
  $('copyBtn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(overlayUrl);
      $('copyBtn').textContent = 'הועתק ✓';
      setTimeout(() => ($('copyBtn').textContent = 'העתקה'), 1500);
    } catch {
      $('copyBtn').textContent = 'סמנו והעתיקו ידנית';
    }
  };

  connect();
</script>
</body>
</html>
